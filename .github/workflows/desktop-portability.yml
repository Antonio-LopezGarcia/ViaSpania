name: Portabilidad de escritorio

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_installers:
        description: Construir instaladores autónomos con GDAL/PROJ
        required: false
        type: boolean
        default: false
      release_tag:
        description: Etiqueta de la Release en la que publicar los instaladores
        required: true
        type: string
        default: v0.2.1
      installer_platform:
        description: Plataforma cuyos instaladores se construirán y publicarán
        required: true
        type: choice
        options:
          - all
          - windows
          - linux-amd64
          - linux-arm64
        default: all

jobs:
  quality:
    name: Código compartido · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Dependencias nativas de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  installers:
    name: Instalador · ${{ matrix.label }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_installers
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.installer_platform == 'windows' && '{"include":[{"label":"Windows x64","os":"windows-2025","command":"pnpm desktop:build:windows"}]}' || inputs.installer_platform == 'linux-amd64' && '{"include":[{"label":"Linux AMD64","os":"ubuntu-24.04","command":"pnpm desktop:build:linux"}]}' || inputs.installer_platform == 'linux-arm64' && '{"include":[{"label":"Linux ARM64","os":"ubuntu-22.04-arm","command":"pnpm desktop:build:linux"}]}' || '{"include":[{"label":"macOS ARM64","os":"macos-14","command":"pnpm desktop:build:macos"},{"label":"Linux AMD64","os":"ubuntu-24.04","command":"pnpm desktop:build:linux"},{"label":"Linux ARM64","os":"ubuntu-22.04-arm","command":"pnpm desktop:build:linux"},{"label":"Windows x64","os":"windows-2025","command":"pnpm desktop:build:windows"}]}') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: conda-incubator/setup-miniconda@v4
        if: runner.os == 'Windows'
        with:
          activate-environment: viaspania-build
          miniforge-version: latest
          channels: conda-forge
          conda-remove-defaults: true
      - name: GDAL/PROJ en macOS
        if: runner.os == 'macOS'
        run: brew install gdal
      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev gdal-bin libgdal-dev proj-bin patchelf rpm
      - name: GDAL/PROJ en Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          conda install -n viaspania-build -c conda-forge gdal -y
          $prefix = conda run -n viaspania-build python -c "import sys; print(sys.prefix)"
          $prefix = $prefix.Trim()
          "$prefix\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "GDAL_DATA=$prefix\Library\share\gdal" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROJ_DATA=$prefix\Library\share\proj" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
      - name: Verificar GDAL empaquetado en Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package_root="$(mktemp -d)"
          trap 'rm -rf "$package_root"' EXIT
          package="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$package"
          dpkg-deb -x "$package" "$package_root"
          gdalinfo="$(find "$package_root" -path '*/geospatial/bin/gdalinfo' -type f -print -quit)"
          test -x "$gdalinfo"
          geospatial="$(dirname "$(dirname "$gdalinfo")")"
          test ! -e "$geospatial/lib/libc.so.6"
          export GDAL_DATA="$geospatial/share/gdal"
          export PROJ_DATA="$geospatial/share/proj"
          export PROJ_LIB="$geospatial/share/proj"
          export LD_LIBRARY_PATH="$geospatial/lib"
          source_tif="$(find "$geospatial/share/proj" -name '*.tif' -type f -print -quit)"
          test -n "$source_tif"
          "$gdalinfo" -json "$source_tif" > "$package_root/source.json"
          "$geospatial/bin/gdal_translate" -q -of GTiff "$source_tif" "$package_root/smoke.tif"
          "$gdalinfo" -json -stats "$package_root/smoke.tif" > "$package_root/smoke.json"
          test -s "$package_root/smoke.json"
      - name: Publicar instalador de macOS
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" src-tauri/target/release/bundle/dmg/*.dmg --clobber
      - name: Publicar instaladores de Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/rpm/*.rpm --clobber
      - name: Publicar instalador de Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = Get-ChildItem src-tauri/target/release/bundle/msi/*.msi, src-tauri/target/release/bundle/nsis/*-setup.exe
          gh release upload "${{ inputs.release_tag }}" @($installers.FullName) --clobber
